      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2440"/>
    </linearGradient>
  </defs>
  <!-- rounded rect background -->
  <rect width="128" height="128" rx="22" ry="22" fill="url(#bg)"/>
  <!-- N letter -->
